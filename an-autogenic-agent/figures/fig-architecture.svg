<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#000" stroke-width="1.2"/>
    </marker>
  </defs>
  <!-- L4 -->
  <rect x="40" y="40" width="280" height="280" rx="12" ry="12" fill="#F8F8F8" stroke="#000" stroke-width="0.75"/>
  <!-- L3 -->
  <rect x="60" y="60" width="240" height="240" rx="11" ry="11" fill="#F0F0F0" stroke="#000" stroke-width="0.75"/>
  <!-- L2 -->
  <rect x="80" y="80" width="200" height="200" rx="10" ry="10" fill="#E8E8E8" stroke="#000" stroke-width="0.75"/>
  <!-- L1 -->
  <rect x="100" y="100" width="160" height="160" rx="9" ry="9" fill="#E0E0E0" stroke="#000" stroke-width="0.75"/>
  <!-- L0 -->
  <rect x="120" y="120" width="120" height="120" rx="7" ry="7" fill="#D8D8D8" stroke="#000" stroke-width="2"/>
  <!-- L0 labels -->
  <text x="180" y="160" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">KERNEL</text>
  <text x="180" y="178" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">Four laws</text>
  <!-- Left mutability arrow -->
  <line x1="22" y1="70" x2="22" y2="290" stroke="#000" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <text x="10" y="60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" font-weight="bold" letter-spacing="1.2" fill="#000">MUTABILITY</text>
  <text x="10" y="82" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" fill="#000">agent modifies</text>
  <text x="10" y="300" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" fill="#000">invariant core</text>
  <!-- Labels in gaps (right side) -->
  <text x="305" y="95" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6.5">
    <tspan fill="#666" font-weight="bold">L4</tspan>
    <tspan fill="#000" font-weight="bold"> ONTOLOGY</tspan>
    <tspan fill="#555"> — Categories of what can exist. Principal-owned, stable.</tspan>
  </text>
  <text x="285" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6.5">
    <tspan fill="#666" font-weight="bold">L3</tspan>
    <tspan fill="#000" font-weight="bold"> LOADED LAYERS</tspan>
    <tspan fill="#555"> — Cognitive Fabric, Thalamus, Hippocampus, Ganglia, Ontics.</tspan>
  </text>
  <text x="265" y="175" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6.5">
    <tspan fill="#666" font-weight="bold">L2</tspan>
    <tspan fill="#000" font-weight="bold"> FACULTIES</tspan>
    <tspan fill="#555"> — Ten emergent capabilities: awareness, relationships, agency.</tspan>
  </text>
  <text x="245" y="215" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6.5">
    <tspan fill="#666" font-weight="bold">L1</tspan>
    <tspan fill="#000" font-weight="bold"> SUB-AGENTS</tspan>
    <tspan fill="#555"> — 84 specialized capabilities. The five-member dev team.</tspan>
  </text>
  <text x="225" y="255" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6.5">
    <tspan fill="#666" font-weight="bold">L0</tspan>
    <tspan fill="#000" font-weight="bold"> KERNEL</tspan>
    <tspan fill="#555"> — Four invariant laws. Unreachable by the agent.</tspan>
  </text>
</svg>