<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
  <!-- Nodes -->
  <circle cx="400" cy="70" r="28" stroke="#000" stroke-width="1" fill="none"/>
  <circle cx="150" cy="210" r="28" stroke="#000" stroke-width="1" fill="none"/>
  <circle cx="650" cy="210" r="28" stroke="#000" stroke-width="1" fill="none"/>
  <!-- Labels in nodes -->
  <text x="400" y="74" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">PRICE</text>
  <text x="150" y="214" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">DEMAND</text>
  <text x="650" y="214" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">SUPPLY</text>
  <!-- Curved arrows (clockwise arcs) -->
  <!-- PRICE -> DEMAND -->
  <path d="M375,95 Q250,140 178,185" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="130" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" fill="#000">sets</text>
  <!-- DEMAND -> SUPPLY -->
  <path d="M178,210 Q400,255 622,210" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="395" y="268" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" fill="#000">signals</text>
  <!-- SUPPLY -> PRICE -->
  <path d="M622,185 Q550,140 425,95" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="555" y="130" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" fill="#000">clears</text>
</svg>