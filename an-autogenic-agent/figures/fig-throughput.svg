<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 285" font-family="'Helvetica','Arial',sans-serif" font-size="11">
  <!-- Gridlines (shared by the two y-axes) -->
  <g stroke="#dedede" stroke-width="0.5">
    <line x1="60" y1="40"  x2="450" y2="40"/>
    <line x1="60" y1="84"  x2="450" y2="84"/>
    <line x1="60" y1="128" x2="450" y2="128"/>
    <line x1="60" y1="172" x2="450" y2="172"/>
    <line x1="60" y1="216" x2="450" y2="216"/>
  </g>

  <!-- Plateau week shading (30 May – 5 Jun: week 4, autogenic shipped 0) -->
  <rect x="306" y="40" width="82" height="220" fill="#f0c85a" fill-opacity="0.18"/>

  <!-- State-transition telemetry cutover marker (5 Jun) -->
  <line x1="388" y1="40" x2="388" y2="260" stroke="#8a6d1e" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="388" y="34" fill="#8a6d1e" font-size="9" text-anchor="middle" font-weight="600">telemetry reliable</text>

  <!-- Axes -->
  <g stroke="#333" stroke-width="1" fill="none">
    <line x1="60" y1="260" x2="450" y2="260"/>
    <line x1="60" y1="40"  x2="60"  y2="260"/>
    <line x1="450" y1="40" x2="450" y2="260"/>
  </g>

  <!-- Left y-axis (autogenic Findings) — scale: y = 260 - v * 220/150 -->
  <g fill="#1f5fa8" font-size="10" text-anchor="end">
    <text x="55" y="264">0</text>
    <text x="55" y="220">30</text>
    <text x="55" y="176">60</text>
    <text x="55" y="132">90</text>
    <text x="55" y="88">120</text>
    <text x="55" y="44">150</text>
  </g>
  <text x="18" y="150" transform="rotate(-90 18 150)" text-anchor="middle" fill="#1f5fa8" font-size="10.5">
    Cumulative autogenic Findings shipped
  </text>

  <!-- Right y-axis (net LOC, surviving-tree growth — mixed authorship) -->
  <g fill="#2e8a3a" font-size="10" text-anchor="start">
    <text x="455" y="264">0</text>
    <text x="455" y="220">30k</text>
    <text x="455" y="176">60k</text>
    <text x="455" y="132">90k</text>
    <text x="455" y="88">120k</text>
    <text x="455" y="44">150k</text>
  </g>
  <text x="492" y="150" transform="rotate(90 492 150)" text-anchor="middle" fill="#2e8a3a" font-size="10.5">
    Cumulative net LOC (tree growth)
  </text>

  <!-- X-axis labels (week endpoints) -->
  <g fill="#444" font-size="9.5" text-anchor="middle">
    <text x="60"  y="275">9 May</text>
    <text x="142" y="275">16 May</text>
    <text x="224" y="275">23 May</text>
    <text x="306" y="275">30 May</text>
    <text x="388" y="275">5 Jun</text>
    <text x="450" y="275">8 Jun</text>
  </g>

  <!--
    Autogenic Findings shipped (Vega-originated), close date = COALESCE(shipped_at, proposed_at):
      cumulative: 0, 64, 114, 135, 135, 144   → 260, 166.1, 92.8, 62.0, 62.0, 48.8
      weekly deltas:  64, 50, 21, 0, 9
    Net LOC (surviving tree, mixed authorship, from code_size_snapshots):
      cumulative: 0, 20536, 89909, 109713, 131818, 135165 → 260, 229.9, 128.1, 99.1, 66.7, 61.8
    User-filed (out of frame, footnoted only):
      shipped: 15 (weekly 9, 2, 2, 0, 2). Human tickets in the same registry, not autogenic.
  -->

  <!-- Cumulative net LOC line (green, thin — supporting) -->
  <polyline fill="none" stroke="#2e8a3a" stroke-width="1.6" stroke-linejoin="round"
    points="60,260 142,229.9 224,128.1 306,99.1 388,66.7 450,61.8"/>
  <g fill="#2e8a3a">
    <rect x="57"  y="257" width="6" height="6"/>
    <rect x="139" y="226.9" width="6" height="6"/>
    <rect x="221" y="125.1" width="6" height="6"/>
    <rect x="303" y="96.1"  width="6" height="6"/>
    <rect x="385" y="63.7"  width="6" height="6"/>
    <rect x="447" y="58.8"  width="6" height="6"/>
  </g>
  <text x="454" y="54" fill="#2e8a3a" font-size="9" font-weight="600">LOC 135k</text>

  <!-- Autogenic Findings line (Vega-originated, blue, primary) -->
  <polyline fill="none" stroke="#1f5fa8" stroke-width="2.4" stroke-linejoin="round"
    points="60,260 142,166.1 224,92.8 306,62.0 388,62.0 450,48.8"/>
  <g fill="#1f5fa8">
    <circle cx="60"  cy="260"   r="3"/>
    <circle cx="142" cy="166.1" r="3"/>
    <circle cx="224" cy="92.8"  r="3"/>
    <circle cx="306" cy="62.0"  r="3"/>
    <circle cx="388" cy="62.0"  r="3"/>
    <circle cx="450" cy="48.8"  r="3.5"/>
  </g>
  <text x="454" y="45" fill="#1f5fa8" font-size="10" font-weight="600">Vega 144</text>

  <!-- Weekly delta labels above each Vega marker -->
  <g fill="#1f5fa8" font-size="9" text-anchor="middle" font-weight="600">
    <text x="142" y="158">+64</text>
    <text x="224" y="84">+50</text>
    <text x="306" y="54">+21</text>
    <text x="347" y="76" fill="#8a6d1e">+0</text>
    <text x="420" y="44">+9</text>
  </g>

  <!-- Divergence annotation inside the plateau band -->
  <g fill="#8a6d1e" font-size="8.5" text-anchor="middle">
    <text x="347" y="120">wk 4: tree +22k LOC,</text>
    <text x="347" y="130">autogenic shipped 0</text>
  </g>

</svg>
