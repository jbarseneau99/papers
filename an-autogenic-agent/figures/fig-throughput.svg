<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" font-family="'Helvetica','Arial',sans-serif" font-size="11">
  <!-- Plot area: x 60..470, y 40..260 -->
  <!-- gridlines -->
  <g stroke="#dedede" stroke-width="0.5">
    <line x1="60" y1="40"  x2="470" y2="40"/>
    <line x1="60" y1="84"  x2="470" y2="84"/>
    <line x1="60" y1="128" x2="470" y2="128"/>
    <line x1="60" y1="172" x2="470" y2="172"/>
    <line x1="60" y1="216" x2="470" y2="216"/>
  </g>
  <!-- axes -->
  <g stroke="#333" stroke-width="1" fill="none">
    <line x1="60" y1="260" x2="470" y2="260"/>
    <line x1="60" y1="40"  x2="60"  y2="260"/>
  </g>
  <!-- y ticks + labels (0..130, step 20 → 6 gridlines + baseline; 220px / 130 → ~1.69 px/unit ; label at 0,20,40,60,80,100,120) -->
  <g fill="#444" font-size="10" text-anchor="end">
    <text x="55" y="264">0</text>
    <text x="55" y="220">20</text>
    <text x="55" y="176">40</text>
    <text x="55" y="132">60</text>
    <text x="55" y="88">80</text>
    <text x="55" y="44">100</text>
  </g>
  <!-- y-axis title (rotated) -->
  <text x="18" y="150" transform="rotate(-90 18 150)" text-anchor="middle" fill="#333" font-size="10.5">
    Cumulative shipped Findings
  </text>

  <!-- x ticks: 6 dates evenly spaced across 60..470 (410 span / 5 = 82) -->
  <g fill="#444" font-size="9.5" text-anchor="middle">
    <text x="60"  y="275">9 May</text>
    <text x="142" y="275">16 May</text>
    <text x="224" y="275">23 May</text>
    <text x="306" y="275">30 May</text>
    <text x="388" y="275">5 Jun</text>
    <text x="470" y="275">8 Jun</text>
  </g>

  <!-- Data mapping: y = 260 - v * (220/130) = 260 - v*1.6923
       Vega:  0, 15, 37, 65, 97, 118 → 260, 234.6, 197.4, 150.0, 95.8, 60.3
       User:  0,  4, 11, 21, 32,  39 → 260, 253.2, 241.4, 224.5, 205.8, 194.0
       Team:  0,  0,  1,  1,  2,   2 → 260, 260,   258.3, 258.3, 256.6, 256.6 -->

  <!-- Vega (solid, thick, blue) -->
  <polyline fill="none" stroke="#1f5fa8" stroke-width="2.4" stroke-linejoin="round"
    points="60,260 142,234.6 224,197.4 306,150 388,95.8 470,60.3"/>
  <g fill="#1f5fa8">
    <circle cx="60"  cy="260"   r="3"/>
    <circle cx="142" cy="234.6" r="3"/>
    <circle cx="224" cy="197.4" r="3"/>
    <circle cx="306" cy="150"   r="3"/>
    <circle cx="388" cy="95.8"  r="3"/>
    <circle cx="470" cy="60.3"  r="3.5"/>
  </g>
  <text x="474" y="63"  fill="#1f5fa8" font-size="10" font-weight="600">Vega · 118</text>

  <!-- User (dashed, orange) -->
  <polyline fill="none" stroke="#d16a30" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="6,3"
    points="60,260 142,253.2 224,241.4 306,224.5 388,205.8 470,194"/>
  <g fill="#d16a30">
    <path d="M60,260 l-3,4 h6 z"/>
    <path d="M142,253.2 l-3,4 h6 z"/>
    <path d="M224,241.4 l-3,4 h6 z"/>
    <path d="M306,224.5 l-3,4 h6 z"/>
    <path d="M388,205.8 l-3,4 h6 z"/>
    <path d="M470,194 l-3,4 h6 z"/>
  </g>
  <text x="474" y="197" fill="#d16a30" font-size="10" font-weight="600">User · 39</text>

  <!-- Team (dotted, gray) -->
  <polyline fill="none" stroke="#7a7a7a" stroke-width="1.5" stroke-dasharray="2,3"
    points="60,260 142,260 224,258.3 306,258.3 388,256.6 470,256.6"/>
  <g fill="#7a7a7a">
    <rect x="57" y="257" width="6" height="6" transform="rotate(45 60 260)"/>
    <rect x="139" y="257" width="6" height="6" transform="rotate(45 142 260)"/>
    <rect x="221" y="255.3" width="6" height="6" transform="rotate(45 224 258.3)"/>
    <rect x="303" y="255.3" width="6" height="6" transform="rotate(45 306 258.3)"/>
    <rect x="385" y="253.6" width="6" height="6" transform="rotate(45 388 256.6)"/>
    <rect x="467" y="253.6" width="6" height="6" transform="rotate(45 470 256.6)"/>
  </g>
  <text x="474" y="256" fill="#7a7a7a" font-size="10" font-weight="600">Team · 2</text>

  <!-- Legend line, discreet, top-left -->
  <g font-size="9.5" fill="#555">
    <text x="65" y="30">Total: 159 Findings shipped, 9 May – 8 Jun 2026 (30-day run)</text>
  </g>
</svg>
