  <!-- y = 260 - v * (220/150) = 260 - v*1.4667
       Vega:  0, 25, 55, 90, 125, 144 → 260, 223.3, 179.3, 128, 76.7, 48.8
       User:  0,  3,  6, 10,  13,  15 → 260, 255.6, 251.2, 245.3, 240.9, 238 -->

  <polyline fill="none" stroke="#1f5fa8" stroke-width="2.4" stroke-linejoin="round"
