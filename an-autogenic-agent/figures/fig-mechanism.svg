<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 640"
     font-family="'Helvetica','Arial',sans-serif">
  <!--
    IEEE-compliant mechanism figure, v6.
    Four distinct box categories (structural / behavioral / designed-or-automated / flow)
    with joint colour + border + label encoding so grayscale reduction preserves categories:
      STRUCTURAL (kernel-enforced, ADR 0012): light blue fill, solid navy border, navy label
        — reserved for mechanisms actually enforced by the invariant kernel
      BEHAVIORAL (workflow / actor, human-in-loop): light orange fill, dashed orange border
      DESIGNED / AUTOMATED (runtime code, actor-configured): light gray fill, dashed gray border
        — coherence check (designed, unpopulated) and boot+health rollback (automated)
      FLOW / AGENT ACTION: white fill, thin gray border, black label
    viewBox 1000x640; column scale ~0.252 pt/unit. Fonts: 34 ~ 8.6 pt, 30 ~ 7.6 pt.
  -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- =====  TOP ROW: Input flow (neutral)  ===== -->
  <g>
    <rect x="30" y="20" width="220" height="72" fill="#fff" stroke="#666" stroke-width="1.1" rx="4"/>
    <text x="140" y="52" text-anchor="middle" font-size="34" font-weight="400">Discourse</text>
    <text x="140" y="78" text-anchor="middle" font-size="26" fill="#666">chat, agents</text>
  </g>
  <line x1="250" y1="56" x2="315" y2="56" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
  <g>
    <rect x="315" y="20" width="220" height="72" fill="#fff" stroke="#666" stroke-width="1.1" rx="4"/>
    <text x="425" y="52" text-anchor="middle" font-size="34" font-weight="400">Finding</text>
    <text x="425" y="78" text-anchor="middle" font-size="26" fill="#666">weighed threshold</text>
  </g>
  <line x1="535" y1="56" x2="600" y2="56" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
  <g>
    <rect x="600" y="20" width="220" height="72" fill="#fff" stroke="#666" stroke-width="1.1" rx="4"/>
    <text x="710" y="52" text-anchor="middle" font-size="34" font-weight="400">Analyst</text>
    <text x="710" y="78" text-anchor="middle" font-size="26" fill="#666">routes to path</text>
  </g>

  <!-- Router split -->
  <line x1="710" y1="92" x2="710" y2="128" stroke="#333" stroke-width="1.4"/>
  <line x1="230" y1="128" x2="710" y2="128" stroke="#333" stroke-width="1.4"/>
  <line x1="230" y1="128" x2="230" y2="172" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="710" y1="128" x2="710" y2="172" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- =====  PANEL LABELS  ===== -->
  <text x="230" y="165" text-anchor="middle" font-size="36" font-weight="500">(a) Instance path</text>
  <text x="710" y="165" text-anchor="middle" font-size="36" font-weight="500">(b) Ontic-break path</text>

  <!-- =====  INSTANCE PATH (left)  ===== -->
  <!-- Neutral: AutogenicCycle -->
  <g>
    <rect x="80" y="180" width="300" height="72" fill="#fff" stroke="#666" stroke-width="1.1" rx="4"/>
    <text x="230" y="212" text-anchor="middle" font-size="32" font-weight="400">AutogenicCycle</text>
    <text x="230" y="238" text-anchor="middle" font-size="26" fill="#666">agent implements</text>
  </g>
  <line x1="230" y1="252" x2="230" y2="278" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- STRUCTURAL: Invariant kernel -->
  <g>
    <rect x="80" y="282" width="300" height="86" fill="#e8f0fa" stroke="#1f3a68" stroke-width="1.6" rx="4"/>
    <text x="230" y="316" text-anchor="middle" font-size="32" font-weight="400" fill="#1f3a68">Invariant kernel</text>
    <text x="230" y="342" text-anchor="middle" font-size="26" fill="#5a6d85">ADR 0012</text>
    <text x="230" y="362" text-anchor="middle" font-size="26" fill="#5a6d85">validate at construction</text>
  </g>
  <line x1="230" y1="368" x2="230" y2="394" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- DESIGNED / AUTOMATED: Coherence check (designed, unpopulated over the reported window) -->
  <g>
    <rect x="80" y="398" width="300" height="72" fill="#f2f2f2" stroke="#666" stroke-width="1.4" stroke-dasharray="6,3" rx="4"/>
    <text x="230" y="430" text-anchor="middle" font-size="32" font-weight="400" fill="#333">Coherence check</text>
    <text x="230" y="456" text-anchor="middle" font-size="26" fill="#666">designed; §IV-D, not populated</text>
  </g>

  <text x="230" y="498" text-anchor="middle" font-size="26" font-style="italic" fill="#a05a1e">
    approval + deploy still gate the
  </text>
  <text x="230" y="522" text-anchor="middle" font-size="26" font-style="italic" fill="#a05a1e">
    tree (behavioral)
  </text>

  <!-- =====  ONTIC-BREAK PATH (right)  ===== -->
  <!-- BEHAVIORAL: Accept -->
  <g>
    <rect x="560" y="180" width="300" height="60" fill="#fdf1e4" stroke="#c0651e" stroke-width="1.6" stroke-dasharray="6,3" rx="4"/>
    <text x="710" y="208" text-anchor="middle" font-size="32" font-weight="400" fill="#8a4515">Accept</text>
    <text x="710" y="230" text-anchor="middle" font-size="26" fill="#b58255">FDD classifies</text>
  </g>
  <line x1="710" y1="240" x2="710" y2="258" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- BEHAVIORAL: FixProposal -->
  <g>
    <rect x="560" y="260" width="300" height="60" fill="#fdf1e4" stroke="#c0651e" stroke-width="1.6" stroke-dasharray="6,3" rx="4"/>
    <text x="710" y="288" text-anchor="middle" font-size="32" font-weight="400" fill="#8a4515">FixProposal</text>
    <text x="710" y="310" text-anchor="middle" font-size="26" fill="#b58255">agent-authored</text>
  </g>
  <line x1="710" y1="320" x2="710" y2="338" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- BEHAVIORAL: Principal approval -->
  <g>
    <rect x="560" y="340" width="300" height="60" fill="#fdf1e4" stroke="#c0651e" stroke-width="1.6" stroke-dasharray="6,3" rx="4"/>
    <text x="710" y="368" text-anchor="middle" font-size="32" font-weight="400" fill="#8a4515">Principal approval</text>
    <text x="710" y="390" text-anchor="middle" font-size="26" fill="#b58255">human token</text>
  </g>
  <line x1="710" y1="400" x2="710" y2="418" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Neutral: Atomic apply -->
  <g>
    <rect x="560" y="420" width="300" height="60" fill="#fff" stroke="#666" stroke-width="1.1" rx="4"/>
    <text x="710" y="448" text-anchor="middle" font-size="32" font-weight="400">Atomic apply</text>
    <text x="710" y="470" text-anchor="middle" font-size="26" fill="#666">supervised restart</text>
  </g>
  <line x1="710" y1="480" x2="710" y2="498" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- DESIGNED / AUTOMATED: Boot + health (automated auto-rollback; actor-configured, not kernel-structural) -->
  <g>
    <rect x="560" y="500" width="300" height="60" fill="#f2f2f2" stroke="#666" stroke-width="1.4" stroke-dasharray="6,3" rx="4"/>
    <text x="710" y="528" text-anchor="middle" font-size="32" font-weight="400" fill="#333">Boot + health</text>
    <text x="710" y="550" text-anchor="middle" font-size="26" fill="#666">automated; actor-configured</text>
  </g>

  <!-- =====  LEGEND (bottom, four category swatches)  ===== -->
  <line x1="30" y1="580" x2="970" y2="580" stroke="#888" stroke-width="0.8"/>
  <g>
    <rect x="30" y="592" width="24" height="18" fill="#e8f0fa" stroke="#1f3a68" stroke-width="1.6" rx="2"/>
    <text x="62" y="607" font-size="22" fill="#1f3a68">structural (kernel-enforced, ADR 0012)</text>
  </g>
  <g>
    <rect x="440" y="592" width="24" height="18" fill="#fdf1e4" stroke="#c0651e" stroke-width="1.6" stroke-dasharray="4,2" rx="2"/>
    <text x="472" y="607" font-size="22" fill="#8a4515">behavioral (workflow / actor)</text>
  </g>
  <g>
    <rect x="750" y="592" width="24" height="18" fill="#f2f2f2" stroke="#666" stroke-width="1.4" stroke-dasharray="4,2" rx="2"/>
    <text x="782" y="607" font-size="22" fill="#333">designed / automated</text>
  </g>
  <g>
    <rect x="30" y="618" width="24" height="18" fill="#fff" stroke="#666" stroke-width="1.1" rx="2"/>
    <text x="62" y="633" font-size="22" fill="#333">flow / agent action</text>
  </g>
</svg>
